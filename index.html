<style>
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --ink:#16201B; --muted:#5A6761; --line:#D8DED9; --soft:#EAEFEB; --track:#E1E7E2;
  --accent:#8E2A57; --accent-ink:#FFFFFF; --accent-soft:#F3E4EB;
  --ok:#2D7A4C; --mid:#8F5A0B; --low:#B83A28;
  --font:"Barlow","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#18201C; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2B3631; --soft:#212B26; --track:#27312C;
    --accent:#E27CA8; --accent-ink:#1C0C14; --accent-soft:#3B2330;
    --ok:#5DBB82; --mid:#E1A64C; --low:#EF7C68;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18201C; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2B3631; --soft:#212B26; --track:#27312C;
  --accent:#E27CA8; --accent-ink:#1C0C14; --accent-soft:#3B2330;
  --ok:#5DBB82; --mid:#E1A64C; --low:#EF7C68;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;margin-bottom:4px}
.top-r{display:flex;gap:8px;align-items:center}
h1{font:600 30px/1 var(--cond);margin:0;letter-spacing:.005em}
h2{font:600 24px/1.1 var(--cond);margin:0}
h3.sec{font:600 20px/1.1 var(--cond);margin:28px 0 8px}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted)}
.intro{margin:0 0 6px;color:var(--muted)}

.primary{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px 16px;font-weight:600;font-size:16px}
.primary:disabled{opacity:.45;cursor:default}
.small{width:auto;padding:8px 14px;font-size:15px;border-radius:999px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:500}
.ghost.small{border-radius:999px;padding:7px 13px}
.ghost.danger{color:var(--low);border-color:color-mix(in srgb,var(--low) 40%,var(--line))}
.ghost.confirming{background:var(--low);color:#fff;border-color:var(--low)}
.link{background:none;border:0;padding:6px 0;min-height:40px;color:var(--accent);font-weight:600}
.back{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;font-size:16px}
.icon{background:none;border:0;width:36px;height:36px;border-radius:8px;color:var(--muted);font-size:16px;flex:none}
.icon:hover{background:var(--soft)}
.row-actions{display:flex;gap:10px;margin-top:24px}
.row-actions>*{flex:1}
.who{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:5px 11px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.datenav{display:flex;align-items:center;gap:4px;min-width:0}
.datenav .icon{font-size:22px;color:var(--ink)}
.datetitle{background:none;border:0;padding:0;text-align:left;min-width:0}
.datetitle small{display:block;font-size:13px;color:var(--muted);margin-top:2px}

.energy{padding:6px 0 18px}
.e-line{display:flex;align-items:baseline;gap:10px}
.e-num{font:600 68px/.9 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.e-unit{font:500 18px var(--cond);color:var(--muted)}
.ruler{--step:10%;position:relative;height:16px;margin-top:12px;background:var(--track);border-radius:3px;overflow:hidden}
.ruler .fill{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:3px 0 0 3px}
.ruler.over .fill{background:var(--low)}
.ruler .ticks{position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--step) - 2px),var(--bg) calc(var(--step) - 2px),var(--bg) var(--step))}
.e-sub{display:flex;justify-content:space-between;margin-top:8px;font-size:15px}
.e-sub b{font-weight:600}

.bar{height:6px;background:var(--track);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar.over i{background:var(--low)}
.wrow{width:100%;display:flex;justify-content:space-between;align-items:baseline;background:none;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;text-align:left}
.wrow .nm{font-weight:600}
.wrow .val{font:500 19px var(--cond);font-variant-numeric:tabular-nums}
.wrow .val.cta{font:600 15px var(--font);color:var(--accent)}
.micro{display:grid;grid-template-columns:1fr auto 48px;gap:2px 10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.micro .amt{font:500 16px var(--cond);color:var(--muted);font-variant-numeric:tabular-nums}
.micro .pct{font:600 17px var(--cond);text-align:right;font-variant-numeric:tabular-nums}
.micro .bar{grid-column:1/-1;height:4px;margin-top:3px}
.s-ok{color:var(--ok)} .s-mid{color:var(--mid)} .s-low{color:var(--low)}
.b-ok i{background:var(--ok)} .b-mid i{background:var(--mid)} .b-low i{background:var(--low)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:2px 0 6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:currentColor;vertical-align:1px}

.meal{margin-top:22px}
.meal-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.meal-h h3{font:600 21px/1.1 var(--cond);margin:0;flex:1}
.meal-h .kc{font:500 16px var(--cond);color:var(--muted)}
.entries{list-style:none;margin:0;padding:0}
.entry{width:100%;display:flex;justify-content:space-between;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.entry .en{font-weight:500;line-height:1.25}
.entry .en small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.entry .ek{text-align:right;font:500 17px var(--cond);white-space:nowrap;font-variant-numeric:tabular-nums}
.entry .ek small{display:block;color:var(--muted);font:400 13px var(--font)}
.empty-meal{color:var(--muted);font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:13px 20px;font-weight:600;box-shadow:0 6px 18px rgba(60,10,35,.28)}

.results{margin-top:8px}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px}
.res-n{display:block;font-weight:500;line-height:1.25}
.res-n .fav{color:var(--accent);margin-right:4px}
.res-m{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:13px;color:var(--muted)}
.res-h{font:600 15px var(--font);color:var(--muted);margin:16px 0 2px}
.more{font-size:13px;color:var(--muted);padding:12px 2px}
.tag{font:600 11px/1.6 var(--font);padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.t-recipe{background:var(--accent-soft);color:var(--accent)}
.tag.t-mine{background:var(--ink);color:var(--bg)}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.tools{display:flex;gap:8px;margin-top:10px}
.tools>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.rlist{list-style:none;margin:0;padding:0}
.ritem{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0}
.ritem .rn{font:600 21px/1.1 var(--cond)}
.ritem .rn small{display:block;font:400 14px var(--font);color:var(--muted);margin-top:3px}
.ritem .rk{text-align:right;font:500 18px var(--cond);white-space:nowrap}
.ritem .rk small{display:block;font:400 13px var(--font);color:var(--muted)}

.title-in{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;font:600 30px/1.15 var(--cond);padding:4px 0}
.inline-field{display:flex;align-items:center;gap:10px;margin-top:14px}
.inline-field input{width:84px}
.num-in{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;font-variant-numeric:tabular-nums}
.ings{list-style:none;margin:0;padding:0}
.ing-n{font-weight:500;line-height:1.25}
.ing-n small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.add{width:100%;margin-top:10px}
.note-box{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}

.nip{margin-top:28px;border:2px solid var(--ink);border-radius:4px;padding:10px 12px 12px;background:var(--surface)}
.nip h3{font:700 22px/1 var(--cond);margin:0 0 6px}
.nip-meta{font-size:14px;border-bottom:4px solid var(--ink);padding-bottom:6px}
.nip-meta div{display:flex;justify-content:space-between}
.nip table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.nip th,.nip td{padding:5px 0;border-bottom:1px solid var(--line);text-align:right}
.nip th:first-child,.nip td:first-child{text-align:left}
.nip thead th{font-weight:600;font-size:13px;border-bottom:2px solid var(--ink)}
.nip td.sub{padding-left:14px}
.nip h4{font:600 17px var(--cond);margin:14px 0 0;border-bottom:2px solid var(--ink);padding-bottom:3px}
.nip .note{font-size:12px;color:var(--muted);margin:8px 0 0}

.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.form .full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
.fl input,.fl select{padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;width:100%}
details.more-n{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
details.more-n summary{cursor:pointer;font-weight:600;color:var(--accent)}
.tt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
.tt td{padding:7px 0;border-bottom:1px solid var(--line)}
.tt td:last-child{text-align:right;font:500 18px var(--cond)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:18px;font-weight:500}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.status{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:10px 0 14px;font-size:15px}
textarea{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin-top:8px}
.people{list-style:none;margin:0;padding:0}
.people li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}
.people .pn{font-weight:600}
.people .pn small{display:block;font-weight:400;font-size:13px;color:var(--muted)}

/* weight */
.wform{display:flex;gap:8px;align-items:flex-end;margin-top:4px}
.wform .fl{flex:1}
.wform .primary{width:auto;padding:11px 18px}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px;border-top:2px solid var(--ink);padding-top:10px}
.wstats b{display:block;font:600 26px/1 var(--cond);font-variant-numeric:tabular-nums}
.wstats span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-lbl{fill:var(--muted);font:11px var(--font)}
.ch-dot{fill:var(--muted);opacity:.55}
.ch-line{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.wlist .wv{font:500 18px var(--cond);font-variant-numeric:tabular-nums;margin-left:auto;margin-right:6px}


/* v2.1 declutter */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;border-top:1px solid var(--line);padding:12px 0 14px}
.mcell .mh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mcell .nm{font-weight:600;font-size:15px}
.mcell .val{font:500 18px var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.mcell .val span{color:var(--muted);font-size:14px}
.mcell .bar{height:5px;margin-top:5px}
.b-neutral i{background:var(--muted)}
.msum{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:none;border:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:12px 0;margin-top:26px}
.msum b{display:block;font:600 20px/1.15 var(--cond)}
.msum small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.chev{color:var(--muted);font-size:20px;line-height:1;transition:transform .2s;flex:none}
.msum[aria-expanded="true"] .chev{transform:rotate(90deg)}
.empty-meal{display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty-meal .link{padding:2px 0;font-size:15px;text-align:left}
.empty-meal .link.quiet{color:var(--muted);font-weight:500;white-space:nowrap}
.ing{border-bottom:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr) 66px 98px 28px;gap:6px;align-items:center}
.ing .num-in{width:100%;padding:8px 5px}
.ing select{width:100%;min-width:0;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.ing .icon{width:30px;height:32px}
.ing.missing{grid-template-columns:1fr auto}
details.nip-more{margin-top:12px}
details.nip-more>summary,details.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.nip-more>summary::-webkit-details-marker,details.grp>summary::-webkit-details-marker{display:none}
details.nip-more>summary{font:600 17px var(--cond);border-bottom:2px solid var(--ink);padding-bottom:3px}
details[open]>summary .chev{transform:rotate(90deg)}
details.grp{border-top:1px solid var(--line)}
details.grp:last-of-type{border-bottom:1px solid var(--line)}
details.grp>summary{padding:15px 0}
details.grp>summary h2{font:600 21px/1.1 var(--cond)}
details.grp>summary .sum-note{font-size:13px;color:var(--muted);font-weight:400;display:block;margin-top:2px}
details.grp>.grp-body{padding:0 0 18px}
.datehint{margin-top:4px}

/* conservative counting */
.cons{display:block;background:none;border:0;padding:6px 0 0;min-height:32px;color:var(--muted);font-size:13px;text-align:left}
.cons b{color:var(--accent);font-weight:600}
.avgline{font-size:13px;color:var(--muted);margin:-8px 0 14px}
.nip-cons{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--accent);padding-top:4px}
.warnbox{border-left:3px solid var(--mid);background:var(--soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin:14px 0}
/* scanner */
.cam{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;margin-top:6px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;left:12%;right:12%;top:34%;bottom:34%;border:2px solid rgba(255,255,255,.85);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.scanmsg{margin:10px 0;font-size:15px}
.manual{display:flex;gap:8px;margin-top:6px}
.manual input{flex:1;min-width:0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.setup .nav,body.setup .fab{display:none}

.sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(8,14,11,.48);opacity:0;transition:opacity .2s}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease-out}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:36px}
.sh-head .r{display:flex;gap:4px;align-items:center}
.star{background:none;border:0;font-size:22px;line-height:1;width:40px;height:36px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--accent)}
.pick-name{font:600 24px/1.15 var(--cond);margin:2px 0 4px}
.pick-note{font-size:13px;color:var(--muted);margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qty{display:flex;gap:10px;align-items:center}
.qty input{width:120px;font:600 24px var(--cond);padding:8px 10px}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:10px 0}
.preview div{display:flex;flex-direction:column}
.preview b{font:600 24px/1 var(--cond);font-variant-numeric:tabular-nums}
.preview span{font-size:12px;color:var(--muted)}
.lbl{font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 0}
.copylist{list-style:none;margin:0;padding:0}
.copylist button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px}
.copylist b{font-weight:600}
.copylist small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.loading{padding:40vh 0 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .panel,.scrim,.toast{transition:none} }
</style>
</head>
<body>
<main id="app"><p class="loading">Loading your data…</p></main>
<nav class="nav" aria-label="Main"><div class="nav-in">
  <button data-a="go" data-v="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Today</button>
  <button data-a="go" data-v="recipes"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>Recipes</button>
  <button data-a="go" data-v="foods"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>Foods</button>
  <button data-a="go" data-v="weight"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8.5 9.5a4.5 4.5 0 0 1 7 0L12 12z"/></svg>Weight</button>
  <button data-a="go" data-v="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
</div></nav>
<div id="sheet" class="sheet" hidden><div class="scrim" data-a="close"></div><div class="panel" role="dialog" aria-modal="true" aria-label="Details"><div class="grab"></div><div id="sheet-body"></div></div></div>

function parseD(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function shiftDate(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}

function dateLabel(s){const t=todayStr();if(s===t)return 'Today';if(s===shiftDate(t,-1))return 'Yesterday';if(s===shiftDate(t,1))return 'Tomorrow';return parseD(s).toLocaleDateString('en-AU',{weekday:'long'});}
function dateLong(s){return parseD(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'long',year:'numeric'});}

/* ---------- storage: IndexedDB with localStorage fallback, one namespace per person ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{ if(!('indexedDB' in window)) return rej(new Error('no idb')); const r=indexedDB.open('macros',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{this.db=r.result;res();}; r.onerror=()=>rej(r.error); });},
  os(m){return this.db.transaction('kv',m).objectStore('kv');},
  req(q){return new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  get(k){return this.req(this.os('readonly').get(k));},
  put(k,v){return this.req(this.os('readwrite').put(v,k));},
  del(k){return this.req(this.os('readwrite').delete(k));},
  prefix(p){return new Promise((res,rej)=>{const out={};const q=this.os('readonly').openCursor(IDBKeyRange.bound(p,p+'\uffff'));q.onsuccess=()=>{const c=q.result;if(c){out[c.key.slice(p.length)]=c.value;c.continue();}else res(out);};q.onerror=()=>rej(q.error);});},
  delPrefix(p){return this.req(this.os('readwrite').delete(IDBKeyRange.bound(p,p+'\uffff')));}
};
const LS={ get(k){try{const v=localStorage.getItem('macros|'+k);return v?JSON.parse(v):undefined;}catch(e){return undefined;}}, put(k,v){localStorage.setItem('macros|'+k,JSON.stringify(v));}, del(k){localStorage.removeItem('macros|'+k);},
  prefix(p){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('macros|'+p)===0){try{out[k.slice(('macros|'+p).length)]=JSON.parse(localStorage.getItem(k));}catch(e){}}}return out;},
  delPrefix(p){const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('macros|'+p)===0)ks.push(k);}ks.forEach(k=>localStorage.removeItem(k));} };
const Store={
  be:null, kind:'memory', pid:null, people:[], docs:{}, timers:{}, chain:{}, mem:{},
  async init(){
    try{ await IDB.open(); this.be=IDB; this.kind='idb'; }
    catch(e){ try{ localStorage.setItem('macros|t','1'); localStorage.removeItem('macros|t'); this.be=LS; this.kind='local'; }catch(e2){ this.be=null; this.kind='memory'; } }
    if(navigator.storage&&navigator.storage.persist){ try{ this.persisted=await navigator.storage.persist(); }catch(e){} }
    this.people=(await this.getRaw('meta|people'))||[];
    this.pid=await this.getRaw('meta|active');
    if(!this.people.find(p=>p.id===this.pid)) this.pid=this.people[0]?this.people[0].id:null;
    if(this.pid) await this.load();
  },
  async getRaw(k){ if(!this.be) return this.mem[k]; try{ return await this.be.get(k); }catch(e){ return undefined; } },
  async putRaw(k,v){ if(!this.be){ this.mem[k]=v; return; } try{ await this.be.put(k,v); }catch(e){ toast('Couldn’t save. Your phone may be low on storage.'); } },
  async delRaw(k){ if(!this.be){ delete this.mem[k]; return; } try{ await this.be.del(k); }catch(e){} },
  async load(){ this.docs={}; if(!this.be){ const p=this.pid+'|'; for(const k in this.mem) if(k.indexOf(p)===0) this.docs[k.slice(p.length)]=clone(this.mem[k]); return; } try{ this.docs=await this.be.prefix(this.pid+'|'); }catch(e){ this.docs={}; } },
  put(id,data){ this.docs[id]=data; this.schedule(id); },
  del(id){ delete this.docs[id]; this.schedule(id); },
  schedule(id){ clearTimeout(this.timers[id]); this.timers[id]=setTimeout(()=>{ delete this.timers[id]; this.flush(id); },400); },
  flush(id){ const key=this.pid+'|'+id, data=this.docs[id]; const body=data===undefined?undefined:clone(data);
    this.chain[key]=(this.chain[key]||Promise.resolve()).then(()=> body===undefined?this.delRaw(key):this.putRaw(key,body)); return this.chain[key]; },
  flushAll(){ const ps=[]; for(const id of Object.keys(this.timers)){ clearTimeout(this.timers[id]); delete this.timers[id]; ps.push(this.flush(id)); } return Promise.all(ps.concat(Object.values(this.chain))); },
  async addPerson(name){ const id='p'+uid(); this.people.push({id,name}); await this.putRaw('meta|people',this.people); return id; },
  async renamePerson(id,name){ const p=this.people.find(x=>x.id===id); if(p){ p.name=name; await this.putRaw('meta|people',this.people); } },
  async switchTo(id){ await this.flushAll(); this.pid=id; await this.putRaw('meta|active',id); await this.load(); },
  async removePerson(id){ await this.flushAll(); if(this.be) { try{ await this.be.delPrefix(id+'|'); }catch(e){} } else { for(const k in this.mem) if(k.indexOf(id+'|')===0) delete this.mem[k]; }
    this.people=this.people.filter(p=>p.id!==id); await this.putRaw('meta|people',this.people); },
  personName(){ const p=this.people.find(x=>x.id===this.pid); return p?p.name:''; }
};

function foodByBarcode(code){ return customFoods().find(f=>f.barcode===code)||null; }
function unitsOf(f){ const u=[['g',1]]; if(f.dens) u.push(['ml',f.dens]); for(const x of (f.units||[])) u.push(x); return u; }
function gramsOf(f,qty,unit){ const u=unitsOf(f).find(x=>x[0]===unit); return (+qty||0)*(u?u[1]:1); }
function hidden(){ return new Set((Store.docs.hidden&&Store.docs.hidden.recipes)||[]); }
function allRecipes(){ const h=hidden(),m=new Map(); for(const r of DEFAULT_RECIPES) if(!h.has(r.id)) m.set(r.id,r); for(const k in Store.docs) if(k.indexOf('r_')===0){ const r=Store.docs[k]; if(!h.has(r.id)) m.set(r.id,r); } return Array.from(m.values()).sort((a,b)=>a.name.localeCompare(b.name)); }
function getRecipe(id){ if(Store.docs['r_'+id]) return Store.docs['r_'+id]; if(hidden().has(id)) return null; return DEFAULT_RECIPES.find(r=>r.id===id)||null; }
function editableRecipe(id){ let r=Store.docs['r_'+id]; if(!r){ const d=getRecipe(id); if(!d) return null; r=clone(d); Store.docs['r_'+id]=r; } return r; }
function saveRecipe(r){ Store.put('r_'+r.id,r); }
function recipeCalc(r){ const tot=ZERO(); let grams=0; const missing=[]; for(const it of r.items){ const f=getFood(it.fid); if(!f){missing.push(it);continue;} const g=gramsOf(f,it.qty,it.unit); grams+=g; addV(tot,f.v,g/100);} const s=Math.max(1,+r.serves||1); return {tot,per:scaleV(tot,1/s),grams,missing,serves:s}; }
function getDay(d){ return Store.docs['d_'+d]||{date:d,entries:[]}; }
function ensureDay(d){ if(!Store.docs['d_'+d]) Store.docs['d_'+d]={date:d,entries:[]}; return Store.docs['d_'+d]; }
function saveDay(day){ if(day.entries.length) Store.put('d_'+day.date,day); else Store.del('d_'+day.date); }
const DEFAULT_CONS={on:true,lab:5,est:10,quick:15,micro:10};
const UP=['kcal','c','f','sug','sat','na'], DOWN=['p','fib'];
function consSettings(){ return Object.assign({},DEFAULT_CONS,getProfile().cons||{}); }
function tierOf(f){ return f&&(f.src==='est.'||f.origin==='off')?'est':'lab'; }
// Nutrients split by data-reliability tier, so margins can be applied per source.
function entryTiers(kind,ref,qty,unit){
  if(kind==='recipe'){ const r=getRecipe(ref); if(!r) return null; const s=Math.max(1,+r.serves||1),out={};
    for(const it of r.items){ const f=getFood(it.fid); if(!f) continue; const t=tierOf(f); out[t]=out[t]||ZERO(); addV(out[t],f.v,gramsOf(f,it.qty,it.unit)/100*(+qty||0)/s); }
    for(const t in out) out[t]=roundV(out[t]); return out; }
  const f=getFood(ref); if(!f) return null; const o={}; o[tierOf(f)]=roundV(scaleV(f.v,gramsOf(f,qty,unit)/100)); return o;
}
function sumTiers(nt){ const t=ZERO(); for(const k in nt) addV(t,nt[k]); return roundV(t); }
function entryNT(e){ if(e.nt) return e.nt; if(e.kind==='quick') return {quick:e.n}; const f=e.kind==='food'?getFood(e.ref):null; if(f) return {[tierOf(f)]:e.n}; if(e.kind==='recipe'&&getRecipe(e.ref)){ const nt=entryTiers('recipe',e.ref,e.qty,e.unit); const tot=sumTiers(nt); if(tot.kcal>0){ const f2=e.n.kcal/tot.kcal; for(const t in nt) nt[t]=scaleV(nt[t],f2); } return nt; } return {lab:e.n}; }
// Worst case: energy and limits counted high, protein, fibre and micronutrients counted low.
function consV(nt){ const cs=consSettings(), out=ZERO(); for(const t in nt){ const v=nt[t]||{}, m=cs.on?(+cs[t]||0)/100:0, mm=cs.on?Math.max(m,(+cs.micro||0)/100):0;
  for(const k of ORDER){ const x=+v[k]||0; out[k]+= UP.indexOf(k)>=0?x*(1+m): DOWN.indexOf(k)>=0?x*Math.max(0,1-m): x*Math.max(0,1-mm); } } return out; }
const entryCons=e=>consV(entryNT(e));
function dayTotals(day){ const t=ZERO(); for(const e of day.entries) addV(t,entryCons(e)); return t; }
function entryN(kind,ref,qty,unit){ if(kind==='recipe'){ const r=getRecipe(ref); return r?roundV(scaleV(recipeCalc(r).per,+qty||0)):null; } const f=getFood(ref); return f?roundV(scaleV(f.v,gramsOf(f,qty,unit)/100)):null; }
function defaultMeal(){ const h=new Date().getHours(); return h<10?'b':h<14?'l':h<20?'d':'s'; }
const mealName=k=>(MEALS.find(m=>m[0]===k)||MEALS[3])[1];
function favs(){ return (Store.docs.favs&&Store.docs.favs.list)||[]; }
function isFav(kind,id){ return favs().indexOf(kind+':'+id)>=0; }
function toggleFav(kind,id){ const l=favs().slice(), k=kind+':'+id, i=l.indexOf(k); if(i>=0) l.splice(i,1); else l.unshift(k); Store.put('favs',{list:l}); return i<0; }
function weights(){ return (Store.docs.weights&&Store.docs.weights.log)||{}; }
function weightSeries(){ const log=weights(); const ds=Object.keys(log).sort(); let t=null; return ds.map(d=>{ const w=+log[d]; t=t==null?w:t+0.1*(w-t); return {d,w,t}; }); }
function weightRate(s){ if(s.length<2) return null; const last=s[s.length-1]; let ref=null; for(let i=s.length-2;i>=0;i--){ const gap=daysBetween(s[i].d,last.d); if(gap>=7){ ref=s[i]; if(gap>=14) break; } } if(!ref) return null; return (last.t-ref.t)/daysBetween(ref.d,last.d)*7; }

/* ---------- targets ---------- */
function calcTargets(p){ const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161); const tdee=bmr*p.activity, adj={cut:-500,maintain:0,bulk:300}[p.goal]||0; const kcal=Math.round((tdee+adj)/10)*10, prot=Math.round(p.pkg*p.weight), fat=Math.round(p.fkg*p.weight); return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,p:prot,f:fat,c:Math.max(0,Math.round((kcal-prot*4-fat*9)/4)),fib:p.sex==='male'?30:25}; }
function microTargets(p){ const m=p.sex==='male',a=+p.age||30; return {k:m?3800:2800,ca:m?(a>70?1300:1000):(a>50?1300:1000),fe:m?8:(a>50?8:18),zn:m?14:8,mg:m?(a>30?420:400):(a>30?320:310),fol:400,va:m?900:700,vc:45,b12:2.4,vd:a>70?15:a>50?10:5,na:2000}; }
function targets(){ const p=getProfile(),t=calcTargets(p); if(p.manual&&p.custom) for(const k of ['kcal','p','c','f','fib']) if(+p.custom[k]>0) t[k]=+p.custom[k]; Object.assign(t,microTargets(p)); t.sat=Math.round(t.kcal*0.1/9); return t; }
function status(pct,limit){ if(limit) return pct<=0.8?'ok':pct<=1?'mid':'low'; return pct>=0.9?'ok':pct>=0.5?'mid':'low'; }

function viewToday(){
  const t=targets(),day=getDay(UI.date),tot=dayTotals(day),left=t.kcal-tot.kcal,over=left<0,pct=Math.min(1,tot.kcal/t.kcal),step=Math.max(2,250/t.kcal*100);

function searchAll(q,withRecipes,filter){
  const toks=norm(q).split(' ').filter(Boolean),out=[],digits=/^\d{6,14}$/.test(q.trim())?q.trim():null;
  const consider=(kind,item,prio)=>{ if(digits&&item.barcode===digits){ out.push({kind,item,s:100}); return; } const n=item.builtin?(item._n||(item._n=norm(item.name))):norm(item.name); let s=prio+(isFav(kind,item.id)?5:0); for(const t of toks){ const i=n.indexOf(t); if(i<0) return; s+=i===0?4:(n[i-1]===' '?2:0); } s-=n.length/200; out.push({kind,item,s}); };
  filter=filter||'all';
  if(withRecipes) for(const r of allRecipes()) consider('recipe',r,8);
  if(filter==='all'||filter==='mine') for(const f of customFoods()) consider('food',f,7);
  if(filter!=='mine') for(const f of BUILTIN.values()){ if(filter==='products'&&!f.preset) continue; if(filter==='afcd'&&f.preset) continue; consider('food',f,f.preset?6:0); }
  out.sort((a,b)=>b.s-a.s); return out;
}

function chartSVG(s){
  const pts=s.filter(x=>daysBetween(x.d,s[s.length-1].d)<=90); if(pts.length<2) return '';
  const W=360,H=180,L=36,R=8,T=10,B=24; const d0=pts[0].d,span=Math.max(1,daysBetween(d0,pts[pts.length-1].d));
  let lo=Infinity,hi=-Infinity; for(const p of pts){ lo=Math.min(lo,p.w,p.t); hi=Math.max(hi,p.w,p.t); } lo-=0.3; hi+=0.3;
  const X=d=>L+(W-L-R)*daysBetween(d0,d)/span, Y=w=>T+(H-T-B)*(1-(w-lo)/(hi-lo));
  let g=''; for(let i=0;i<=3;i++){ const w=lo+(hi-lo)*i/3, y=Y(w).toFixed(1); g+=`<line class="ch-grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="ch-lbl" x="${L-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${w.toFixed(1)}</text>`; }
  const dots=pts.map(p=>`<circle class="ch-dot" cx="${X(p.d).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="2.6"/>`).join('');
  const line='M'+pts.map(p=>X(p.d).toFixed(1)+' '+Y(p.t).toFixed(1)).join(' L');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart from ${dateShort(d0)} to ${dateShort(pts[pts.length-1].d)}">${g}${dots}<path class="ch-line" d="${line}"/><text class="ch-lbl" x="${L}" y="${H-6}">${dateShort(d0)}</text><text class="ch-lbl" x="${W-R}" y="${H-6}" text-anchor="end">${dateShort(pts[pts.length-1].d)}</text></svg>`;
}
function viewWeight(){
  const s=weightSeries(),log=weights(),last=s[s.length-1],rate=weightRate(s),p=getProfile();
  const wk=s.length?s.filter(x=>daysBetween(x.d,last.d)<7):[];
  const ch7=wk.length>1?wk[wk.length-1].t-wk[0].t:null;
  const sgn=(x,d)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d), fmtRate=r=>r==null?'–':sgn(r,2);
  return `<header class="top"><h1>Weight</h1>${whoChip()}</header>
  <div class="wform"><label class="fl"${UI.wdate?'':' hidden'} id="wdatel">Date<input class="num-in" type="date" id="wdate" value="${todayStr()}" max="${todayStr()}"></label><label class="fl">${UI.wdate?'Weight (kg)':'Today’s weight (kg)'}<input class="num-in" type="number" inputmode="decimal" step="0.1" min="20" id="wval" value="${log[todayStr()]!=null?log[todayStr()]:''}" placeholder="${last?num(last.w):''}"></label><button class="primary" data-a="saveWeight">Save</button></div>${UI.wdate?'':'<button class="link datehint" data-a="wdateShow">Different day?</button>'}
  ${s.length?`<div class="wstats"><div><b>${last.t.toFixed(1)}</b><span>Trend (kg)</span></div><div><b>${ch7==null?'–':sgn(ch7,1)}</b><span>Past 7 days</span></div><div><b>${fmtRate(rate)}</b><span>kg per week</span></div></div>
  ${rate!=null&&rate< -0.01*last.t?`<div class="warnbox" role="note">You’re losing about ${Math.abs(rate).toFixed(2)} kg a week, more than 1% of your body weight. Losing this fast on a cut raises the risk of losing muscle. Consider eating a little more, or lowering the conservative margins in Profile.</div>`:''}
  ${chartSVG(s)||'<p class="fine">Log a few more days to see the chart.</p>'}
  ${Math.abs(last.t-p.weight)>=0.2?`<button class="ghost" style="width:100%;margin-top:12px" data-a="useTrend">Update my targets to ${last.t.toFixed(1)} kg</button>`:''}
  <p class="fine">The trend line smooths out day-to-day water and food swings, so judge progress by it rather than single weigh-ins. ${rate==null?'The weekly rate appears after a week of weigh-ins.':''} A 500 kcal daily deficit works out to roughly 0.45 kg a week.</p>
  <h3 class="sec">Weigh-ins</h3><ul class="wlist">${s.slice().reverse().slice(0,30).map(x=>`<li><span>${dateLong(x.d)}</span><span class="wv">${num(x.w)} kg</span><button class="icon" data-a="delWeight" data-d="${esc(x.d)}" aria-label="Delete ${dateShort(x.d)} weigh-in">✕</button></li>`).join('')}</ul>`
  :`<p class="intro" style="margin-top:16px">Weigh yourself first thing in the morning, after the toilet and before eating, for the most consistent numbers.</p>`}`;
}

const Sheet={
  ret:null,
  focusFirst(){ setTimeout(()=>{ if($('#sheet').hidden||(document.activeElement&&$('#sheet').contains(document.activeElement))) return; const el=$('#sheet-body h2')||$('#sheet-body button'); if(el){ if(el.tagName==='H2') el.setAttribute('tabindex','-1'); el.focus({preventScroll:true}); } },280); },
  open(html){ const s=$('#sheet'); if(s.hidden) this.ret=document.activeElement; $('#sheet-body').innerHTML=html; s.hidden=false; this.focusFirst(); document.body.classList.add('locked'); requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('open'))); },
  set(html){ stopCamera(); $('#sheet-body').innerHTML=html; $('.panel').scrollTop=0; this.focusFirst(); },
  close(){ stopCamera(); const s=$('#sheet'); s.classList.remove('open'); document.body.classList.remove('locked'); SH=null; setTimeout(()=>{ if(!SH){ s.hidden=true; $('#sheet-body').innerHTML=''; } },230); const r=this.ret; this.ret=null; if(r&&r.isConnected&&r.focus) r.focus({preventScroll:true}); }
};

  if($('#sheet').hidden) Sheet.open(html); else Sheet.set(html);

function renderResults(){
  const box=$('#results'); if(!box) return; const q=SH.q.trim(),withR=SH.ctx.mode==='log';
  if(!q){
    let h=''; const fv=favItems().filter(x=>withR||x.kind==='food');
    if(fv.length) h+=`<p class="res-h">Favourites</p>`+fv.map(x=>x.kind==='recipe'?resRecipe(x.item):resFood(x.item)).join('');
    const rec=recentRefs().filter(x=>!isFav(x.kind,x.item.id));
    if(rec.length) h+=`<p class="res-h">Recent</p>`+rec.map(x=>x.kind==='recipe'?resRecipe(x.item):resFood(x.item)).join('');
    if(withR){ const shown=new Set(rec.filter(x=>x.kind==='recipe').map(x=>x.item.id)); const rs=allRecipes().filter(r=>!isFav('recipe',r.id)&&!shown.has(r.id)); if(rs.length) h+=`<p class="res-h">Recipes</p>`+rs.map(resRecipe).join(''); }
    if(!fv.length&&!rec.length) h+=`<p class="res-h">Starter products</p>`+PRESETS.map(p=>resFood(BUILTIN.get(p.id))).join('');
    h+=`<p class="more">Search to find any food, or scan a barcode.</p>`;
    box.innerHTML=h; return;
  }
  const list=searchAll(q,withR);
  box.innerHTML=(list.length?list.slice(0,40).map(x=>x.kind==='recipe'?resRecipe(x.item):resFood(x.item)).join('')+(list.length>40?`<p class="more">Showing 40 of ${list.length}. Keep typing to narrow it down.</p>`:''):`<p class="more">No matches in your foods or the AFCD.</p>`)+offButton(q);
}
function recentRefs(){
  const seen=new Set(),out=[]; const keys=Object.keys(Store.docs).filter(k=>k.indexOf('d_')===0).sort().reverse().slice(0,14);
  for(const k of keys){ const es=Store.docs[k].entries.slice().reverse(); for(const e of es){ if(e.kind==='quick') continue; const key=e.kind+':'+e.ref; if(seen.has(key)) continue; seen.add(key);
    const item=e.kind==='recipe'?getRecipe(e.ref):getFood(e.ref); if(item&&(e.kind==='food'||SH.ctx.mode==='log')) out.push({kind:e.kind,item}); if(out.length>=8) return out; } }
  return out;
}
function openAmount(kind,id){

  if($('#sheet').hidden) Sheet.open(amountHTML()); else Sheet.set(amountHTML());

}

/* ---------- barcode scanning ---------- */
let CAM={stream:null,timer:null,det:null,session:0};
function stopCamera(){ CAM.session++; if(CAM.timer){ clearInterval(CAM.timer); CAM.timer=null; } if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; } }
function openScan(ctx){
  SH={ctx,fromSearch:!!(SH&&SH.fromSearch),scanQ:SH&&SH.q||''};
  const supported='BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  const html=`<div class="sh-head">${SH.fromSearch?'<button class="back" data-a="back">‹ Search</button>':'<span></span>'}<button class="icon" data-a="close" aria-label="Close">✕</button></div>
  <h2 class="pick-name">Scan a barcode</h2>
  ${supported?'<div class="cam"><video id="camv" playsinline muted autoplay></video><div class="reticle"></div></div>':''}
  <p class="scanmsg" id="scanmsg">${supported?'Point the camera at the barcode.':'This browser can’t scan with the camera. Type the number under the barcode instead.'}</p>
  <div class="manual"><input class="num-in" id="bc" inputmode="numeric" placeholder="Or type the barcode number" aria-label="Barcode number"><button class="ghost" data-a="bcGo">Look up</button></div>`;
  if($('#sheet').hidden) Sheet.open(html); else Sheet.set(html);
  if(supported) startCamera();
}
async function startCamera(){
  const msg=$('#scanmsg'), session=++CAM.session;
  try{
    let formats=['ean_13','ean_8','upc_a','upc_e'];
    try{ const sup=await BarcodeDetector.getSupportedFormats(); formats=formats.filter(f=>sup.indexOf(f)>=0); if(!formats.length) throw 0; }catch(e){ if(e===0){ msg.textContent='This phone can’t read product barcodes with the camera. Type the number instead.'; return; } }
    CAM.det=new BarcodeDetector({formats});
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    const vid=$('#camv'); if(session!==CAM.session||!vid){ stream.getTracks().forEach(t=>t.stop()); return; } CAM.stream=stream; vid.srcObject=CAM.stream; await vid.play().catch(()=>{});
    let busy=false;
    CAM.timer=setInterval(async()=>{ if(busy||!vid.videoWidth) return; busy=true; try{ const r=await CAM.det.detect(vid); if(r&&r.length){ const code=r[0].rawValue; stopCamera(); if(navigator.vibrate) navigator.vibrate(60); lookupBarcode(code); } }catch(e){} busy=false; },250);
  }catch(e){ if(msg) msg.textContent=e&&e.name==='NotAllowedError'?'Camera access is blocked. Allow it in Chrome’s site settings, or type the number instead.':'Couldn’t start the camera. Type the number instead.'; stopCamera(); }
}
function offToFood(p,code){
  const n=p.nutriments||{}, g=k=>{ const x=n[k]; return x==null||x===''?null:+x; };
  let kcal=g('energy-kcal_100g'); if(kcal==null){ const kj=g('energy-kj_100g')!=null?g('energy-kj_100g'):g('energy_100g'); if(kj!=null) kcal=kj/4.184; }
  const v=ZERO(); v.kcal=kcal||0; v.p=g('proteins_100g')||0; v.c=g('carbohydrates_100g')||0; v.f=g('fat_100g')||0; v.sat=g('saturated-fat_100g')||0; v.sug=g('sugars_100g')||0; v.fib=g('fiber_100g')||0;
  const na=g('sodium_100g'), salt=g('salt_100g'); v.na=na!=null?na*1000:salt!=null?salt*400:0;
  const mgK={k:'potassium_100g',ca:'calcium_100g',fe:'iron_100g',zn:'zinc_100g',mg:'magnesium_100g',vc:'vitamin-c_100g'}, ugK={fol:'vitamin-b9_100g',va:'vitamin-a_100g',b12:'vitamin-b12_100g',vd:'vitamin-d_100g'};
  for(const k in mgK){ const x=g(mgK[k]); if(x!=null) v[k]=x*1000; } for(const k in ugK){ const x=g(ugK[k]); if(x!=null) v[k]=x*1e6; }
  const brand=(p.brands||'').split(',')[0].trim(), pname=(p.product_name_en||p.product_name||'').trim();
  const name=(brand&&pname.toLowerCase().indexOf(brand.toLowerCase())<0?brand+' ':'')+(pname||'Product '+code);
  const units=[]; const sq=+p.serving_quantity; if(sq>0&&sq<5000) units.push(['serve ('+num(sq)+' g)',sq]);
  return {kcalKnown:kcal!=null,food:{id:'',name:name.slice(0,120),src:'mine',v:clampV(v),units,dens:0}};
}
async function lookupBarcode(code){
  code=String(code||'').replace(/\D/g,''); if(code.length<6){ toast('That barcode looks too short'); return; }
  const ctx=SH?SH.ctx:{mode:'view'}, after=(ctx.mode==='log'||ctx.mode==='recipe')?ctx:null;
  const local=foodByBarcode(code);
  if(local){ if(after){ SH={ctx:after,fromSearch:false}; openAmount('food',local.id); } else openFood(local.id); return; }
  const msg=$('#scanmsg'); if(msg) msg.textContent='Looking up '+code+'…';
  let data=null;
  try{ const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),9000);
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=code,product_name,product_name_en,brands,nutriments,serving_quantity',{signal:ctl.signal,credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'}); clearTimeout(tm);
    const len=+(r.headers.get('content-length')||0); if(r.ok&&len<2e6) data=await r.json(); }
  catch(e){ foodForm(null,{barcode:code,after,msg:'Couldn’t reach Open Food Facts, probably no signal. Enter the values from the label and the barcode will be remembered.'}); return; }
  if(!data||data.status!==1||!data.product){ foodForm(null,{barcode:code,after,msg:'This product isn’t in Open Food Facts yet. Enter the values from the label and the barcode will be remembered.'}); return; }
  const m=offToFood(data.product,code);
  foodForm(m.food,{draft:true,barcode:code,after,origin:'off',msg:m.kcalKnown?'Found on Open Food Facts. These values are community-entered, so check them against the label before saving. Fill the micronutrients from a similar AFCD food if you want them tracked.':'Found the product, but it has no nutrition values. Enter them from the label.'});
}

/* ---------- Open Food Facts name search (online, rate-limited) ---------- */
const OFFQ={times:[],ctl:null,items:new Map()};
function offWait(){ const now=Date.now(); OFFQ.times=OFFQ.times.filter(t=>now-t<60000); return OFFQ.times.length>=8?Math.ceil((60000-(now-OFFQ.times[0]))/1000):0; }
function offButton(q){ q=(q||'').trim(); return q.length>=3?`<div id="offbox"><button class="ghost add" data-a="offSearch">Search Open Food Facts for “${esc(q.slice(0,60))}”</button></div>`:''; }
async function offSearch(q){
  const box=$('#offbox'); if(!box||q.length<3) return;
  if(!navigator.onLine){ box.innerHTML='<p class="more">You’re offline. Online search needs a connection; your saved foods still work.</p>'; return; }
  const wait=offWait(); if(wait){ box.innerHTML=`<p class="more">Open Food Facts allows only a few searches a minute. Try again in ${wait} seconds.</p>`; return; }
  OFFQ.times.push(Date.now()); if(OFFQ.ctl) OFFQ.ctl.abort(); const ctl=OFFQ.ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),12000);
  box.innerHTML='<p class="more">Searching Open Food Facts…</p>';
  try{
    const url='https://world.openfoodfacts.org/cgi/search.pl?'+new URLSearchParams({search_terms:q.slice(0,80),search_simple:'1',action:'process',json:'1',page_size:'24',tagtype_0:'countries',tag_contains_0:'contains',tag_0:'australia',fields:'code,product_name,product_name_en,brands,nutriments,serving_quantity'});
    const r=await fetch(url,{signal:ctl.signal,credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'}); clearTimeout(tm);
    if(OFFQ.ctl!==ctl||!box.isConnected) return;
    if(r.status===429||r.status===503){ box.innerHTML='<p class="more">Open Food Facts is busy or limiting searches. Try again in a minute.</p>'; return; }
    const len=+(r.headers.get('content-length')||0); if(!r.ok||len>4e6) throw new Error('bad response');
    const data=await r.json(); const items=[];
    for(const p of (data&&Array.isArray(data.products)?data.products:[])){ const code=String(p&&p.code||''); if(!/^\d{6,14}$/.test(code)) continue; const m=offToFood(p,code); if(!m.kcalKnown) continue; OFFQ.items.set(code,m.food); items.push({code,food:m.food}); if(items.length>=20) break; }
    if(!box.isConnected) return;
    box.innerHTML=items.length?`<p class="res-h">Open Food Facts</p>`+items.map(x=>`<button class="res" data-a="offPick" data-code="${esc(x.code)}"><span class="res-n">${esc(x.food.name)}</span><span class="res-m"><span class="tag">Open Food Facts</span><span>${num(x.food.v.kcal,'kcal')} kcal, ${num(x.food.v.p)} g protein per 100 g</span></span></button>`).join('')+'<p class="fine">Community-entered data. You’ll check it against the label before it’s saved.</p>'
      :'<p class="more">No Australian products with nutrition values matched. Try the brand name, or scan the barcode.</p>';
  }catch(e){ clearTimeout(tm); if(OFFQ.ctl!==ctl) return; if(box.isConnected) box.innerHTML='<p class="more">Couldn’t reach Open Food Facts. Check your connection and try again.</p>'; }
}
function offPick(code){
  const ctx=SH&&(SH.ctx.mode==='log'||SH.ctx.mode==='recipe')?SH.ctx:null;
  const local=foodByBarcode(code); if(local){ if(ctx){ SH={ctx,fromSearch:false}; openAmount('food',local.id); } else openFood(local.id); return; }
  const f=OFFQ.items.get(code); if(!f) return;
  foodForm(clone(f),{draft:true,barcode:code,after:ctx,origin:'off',msg:'From Open Food Facts. These values are community-entered, so check them against the label before saving. It’s then saved to My foods and works offline.'});
}

  if(!done){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([payload],{type:'application/json'})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); done=true; }catch(e){} }

const DATE_RE=/^\d{4}-\d{2}-\d{2}$/, ID_RE=/^[A-Za-z0-9_.~:@+\-]{1,80}$/;
function numV(v){ return clampV(v); }
function str(x,max){ return String(x==null?'':x).slice(0,max||200); }
function sanitizeDocs(d){
  const out={}; if(!d||typeof d!=='object') return out;
  for(const k of Object.keys(d)){ const v=d[k]; if(!v||typeof v!=='object') continue;
    if(k==='profile'){ const p={}; for(const f of ['age','height','weight','activity','pkg','fkg']){ const x=+v[f]; if(isFinite(x)&&x>0) p[f]=x; } if(v.sex==='male'||v.sex==='female') p.sex=v.sex; if(['cut','maintain','bulk'].indexOf(v.goal)>=0) p.goal=v.goal; p.manual=!!v.manual; if(v.custom&&typeof v.custom==='object'){ p.custom={}; for(const f of ['kcal','p','c','f','fib']){ const x=+v.custom[f]; if(x>0) p.custom[f]=x; } } if(v.cons&&typeof v.cons==='object'){ p.cons={on:v.cons.on!==false}; for(const f of ['lab','est','quick','micro']){ const x=+v.cons[f]; p.cons[f]=isFinite(x)&&x>=0&&x<=50?Math.round(x):DEFAULT_CONS[f]; } } out.profile=p; }
    else if(k==='hidden') out.hidden={recipes:(Array.isArray(v.recipes)?v.recipes:[]).filter(x=>ID_RE.test(x))};
    else if(k==='favs') out.favs={list:(Array.isArray(v.list)?v.list:[]).filter(x=>typeof x==='string'&&/^(food|recipe):/.test(x)&&ID_RE.test(x.split(':')[1]||''))};
    else if(k==='weights'){ const log={}; for(const dk of Object.keys(v.log||{})){ const w=+v.log[dk]; if(DATE_RE.test(dk)&&w>0&&w<500) log[dk]=w; } out.weights={log}; }
    else if(k==='meta'){ out.meta=DATE_RE.test(v.lastBackup||'')?{lastBackup:v.lastBackup}:{}; }
    else if(k.indexOf('d_')===0&&DATE_RE.test(k.slice(2))){ const entries=(Array.isArray(v.entries)?v.entries:[]).filter(e=>e&&typeof e==='object').map(e=>({id:ID_RE.test(e.id)?e.id:uid(),kind:['food','recipe','quick'].indexOf(e.kind)>=0?e.kind:'quick',ref:e.ref&&ID_RE.test(e.ref)?e.ref:null,name:str(e.name)||'Food',qty:+e.qty>0?+e.qty:1,unit:str(e.unit,40)||'serve',meal:['b','l','d','s'].indexOf(e.meal)>=0?e.meal:'s',n:numV(e.n),nt:(e.nt&&typeof e.nt==='object')?Object.fromEntries(Object.keys(e.nt).filter(t=>['lab','est','quick'].indexOf(t)>=0).map(t=>[t,numV(e.nt[t])])):undefined,t:+e.t||0})); out[k]={date:k.slice(2),entries}; }
    else if(k.indexOf('f_')===0&&ID_RE.test(k.slice(2))){ out[k]={id:k.slice(2),name:str(v.name)||'Food',src:'mine',group:'My foods',v:numV(v.v),dens:+v.dens>0?+v.dens:0,units:(Array.isArray(v.units)?v.units:[]).filter(u=>Array.isArray(u)&&+u[1]>0).map(u=>[str(u[0],40),+u[1]]),note:str(v.note),barcode:/^\d{6,14}$/.test(v.barcode||'')?v.barcode:undefined,origin:v.origin==='off'?'off':undefined}; }
    else if(k.indexOf('r_')===0&&ID_RE.test(k.slice(2))){ out[k]={id:k.slice(2),name:str(v.name)||'Recipe',serves:Math.max(1,parseInt(v.serves,10)||1),items:(Array.isArray(v.items)?v.items:[]).filter(it=>it&&ID_RE.test(it.fid||'')).map(it=>({fid:it.fid,qty:+it.qty>0?+it.qty:0,unit:str(it.unit,40)||'g'}))}; }
  }
  return out;
}
async function doImport(text){
  let data; try{ data=JSON.parse(text); }catch(e){ toast('That isn’t a valid backup'); return; }
  if(!data||typeof data.docs!=='object'){ toast('That isn’t a backup from this app'); return; }
  const inc=sanitizeDocs(data.docs), ok=k=>k in inc;
  for(const id of Object.keys(Store.docs)) if(!ok(id)||!(id in inc)) Store.del(id);
  for(const id of Object.keys(inc)) if(ok(id)) Store.put(id,inc[id]);
  await Store.flushAll(); toast('Backup imported'); UI.view='today'; render();
}

/* ---------- events ---------- */
function confirmGate(el){ if(!el.dataset.confirm) return true; if(el.classList.contains('confirming')) return true; const old=el.textContent; el.classList.add('confirming'); el.textContent=el.dataset.confirm; setTimeout(()=>{ if(el.isConnected){ el.classList.remove('confirming'); el.textContent=old; } },3000); return false; }
function setPressed(sel,attr,val){ $$(sel).forEach(b=>b.setAttribute('aria-pressed',b.dataset[attr]===val)); }
const ACT={
  go:el=>{ UI.view=el.dataset.v; window.scrollTo(0,0); render(); },
  day:el=>{ UI.date=shiftDate(UI.date,+el.dataset.n); render(); },
  today:()=>{ UI.date=todayStr(); render(); },
  add:el=>openSearch({mode:'log',meal:el.dataset.meal||defaultMeal()}),
  close:()=>Sheet.close(),
  back:()=>{ const ctx=SH.ctx.mode==='quick'?{mode:'log',meal:SH.ctx.meal}:SH.ctx; openSearch(ctx,SH.q||SH.scanQ||''); },
  pick:el=>{ if(UI.view==='foods'&&!SH) return openFood(el.dataset.id); openAmount(el.dataset.kind,el.dataset.id); },
  unit:el=>{ const u=el.dataset.u; if(u===SH.unit) return; if(SH.pick.kind==='food'){ const f=getFood(SH.pick.id); if(f){ const g=gramsOf(f,SH.qty,SH.unit),nu=unitsOf(f).find(x=>x[0]===u); SH.qty=Math.round(g/(nu?nu[1]:1)*10)/10||1; } } SH.unit=u; $('#qty').value=qtyStr(SH.qty); setPressed('[data-a="unit"]','u',u); updatePreview(); },
  meal:el=>{ SH.meal=el.dataset.m; setPressed('[data-a="meal"]','m',SH.meal); const c=$('#confirm'); if(c&&SH.ctx.mode==='log') c.textContent='Add to '+mealName(SH.meal); const q=$('[data-a="saveQuick"]'); if(q&&SH.ctx.mode==='quick') q.textContent='Add to '+mealName(SH.meal); },
  fav:el=>{ const k=SH.pick.kind,id=SH.pick.id,on=toggleFav(k,id); el.setAttribute('aria-pressed',on); el.textContent=on?'★':'☆'; toast(on?'Added to favourites':'Removed from favourites'); },
  favRecipe:el=>{ const on=toggleFav('recipe',UI.recipeId); el.setAttribute('aria-pressed',on); el.textContent=on?'★':'☆'; toast(on?'Added to favourites':'Removed from favourites'); },
  confirm:()=>{
    if(!(SH.qty>0)) return; const mode=SH.ctx.mode,k=SH.pick.kind,id=SH.pick.id;
    if(mode==='recipe'){ const r=editableRecipe(SH.ctx.recipeId); r.items.push({fid:id,qty:SH.qty,unit:SH.unit}); saveRecipe(r); Sheet.close(); UI.view='recipe'; UI.recipeId=r.id; render(); toast('Ingredient added'); return; }
    const day=ensureDay(UI.date);
    if(mode==='edit'){ const e=day.entries.find(x=>x.id===SH.entry.id); if(e){ const nt=previewNT(); Object.assign(e,{qty:SH.qty,unit:SH.unit,meal:SH.meal,nt,n:sumTiers(nt)}); } saveDay(day); Sheet.close(); render(); toast('Updated'); return; }
    const item=k==='food'?getFood(id):getRecipe(id),nt=entryTiers(k,id,SH.qty,SH.unit); if(!item||!nt) return;
    day.entries.push({id:uid(),kind:k,ref:id,name:item.name,qty:SH.qty,unit:SH.unit,meal:SH.meal,n:sumTiers(nt),nt,t:Date.now()});
    saveDay(day); const m=SH.meal; Sheet.close(); UI.view='today'; render(); toast('Added to '+mealName(m));
  },
  quick:()=>openQuick(null),
  saveQuick:()=>{
    const g=id=>{ const e=$('#'+id); return e&&e.value!==''?parseFloat(e.value):0; };
    const n=ZERO(); n.kcal=g('q_kcal'); n.p=g('q_p'); n.c=g('q_c'); n.f=g('q_f');
    if(!(n.kcal>0)&&!(n.p||n.c||n.f)){ toast('Enter at least the energy'); return; }
    if(!(n.kcal>0)) n.kcal=Math.round(n.p*4+n.c*4+n.f*9);
    const name=($('#q_name').value||'').trim()||'Quick add', day=ensureDay(UI.date);
    if(SH.entry){ const e=day.entries.find(x=>x.id===SH.entry.id); if(e) Object.assign(e,{name,n,nt:{quick:n},meal:SH.meal}); }
    else day.entries.push({id:uid(),kind:'quick',ref:null,name,qty:1,unit:'serve',meal:SH.meal,n,nt:{quick:n},t:Date.now()});
    saveDay(day); const m=SH.meal, wasEdit=!!SH.entry; Sheet.close(); UI.view='today'; render(); toast(wasEdit?'Updated':'Added to '+mealName(m));
  },
  entry:el=>openEntry(el.dataset.id),
  delEntry:el=>{ if(!confirmGate(el)) return; const day=ensureDay(UI.date); day.entries=day.entries.filter(x=>x.id!==SH.entry.id); saveDay(day); Sheet.close(); render(); toast('Removed'); },
  copySheet:el=>openCopy(el.dataset.meal),
  quickCopy:el=>{ const src=getDay(el.dataset.d),meal=el.dataset.meal,day=ensureDay(UI.date),es=src.entries.filter(e=>e.meal===meal); for(const e of es){ const c=clone(e); c.id=uid(); c.t=Date.now(); day.entries.push(c); } saveDay(day); render(); toast(`Copied ${es.length} item${es.length===1?'':'s'}`); },
  microToggle:el=>{ UI.microOpen=!UI.microOpen; el.setAttribute('aria-expanded',UI.microOpen); $('#microlist').hidden=!UI.microOpen; },
  wdateShow:el=>{ UI.wdate=true; $('#wdatel').hidden=false; el.remove(); },
  doCopy:el=>{ const src=getDay(el.dataset.d),meal=SH.ctx.meal,day=ensureDay(UI.date); const es=src.entries.filter(e=>!meal||e.meal===meal); for(const e of es){ const c=clone(e); c.id=uid(); c.t=Date.now(); day.entries.push(c); } saveDay(day); Sheet.close(); render(); toast(`Copied ${es.length} item${es.length===1?'':'s'}`); },
  scan:el=>openScan(el.dataset.ctx==='foods'?{mode:'view'}:(SH?SH.ctx:{mode:'view'})),
  offSearch:()=>offSearch(((SH&&SH.fromSearch)?SH.q:UI.fq)||''),
  offPick:el=>offPick(el.dataset.code),
  bcGo:()=>{ stopCamera(); lookupBarcode($('#bc').value); },
  newRecipe:()=>{ const r={id:'U_'+uid(),name:'New recipe',serves:1,items:[]}; Store.docs['r_'+r.id]=r; saveRecipe(r); UI.recipeId=r.id; UI.view='recipe'; window.scrollTo(0,0); render(); setTimeout(()=>{const i=$('.title-in'); if(i){i.focus();i.select();}},50); },
  openRecipe:el=>{ UI.recipeId=el.dataset.id; UI.view='recipe'; window.scrollTo(0,0); render(); },
  addIng:()=>openSearch({mode:'recipe',recipeId:UI.recipeId}),
  rmIng:el=>{ const r=editableRecipe(UI.recipeId); r.items.splice(+el.dataset.i,1); saveRecipe(r); render(); },
  dupRecipe:()=>{ const r=clone(getRecipe(UI.recipeId)); r.id='U_'+uid(); r.name=r.name+' (copy)'; Store.docs['r_'+r.id]=r; saveRecipe(r); UI.recipeId=r.id; render(); toast('Duplicated'); },
  delRecipe:el=>{ if(!confirmGate(el)) return; const id=UI.recipeId; if(DEFAULT_RECIPES.some(r=>r.id===id)){ const h=clone(Store.docs.hidden||{recipes:[]}); if(h.recipes.indexOf(id)<0) h.recipes.push(id); Store.put('hidden',h); } if(Store.docs['r_'+id]) Store.del('r_'+id); UI.view='recipes'; render(); toast('Recipe deleted'); },
  logRecipe:()=>{ SH={ctx:{mode:'log',meal:defaultMeal()},fromSearch:false}; openAmount('recipe',UI.recipeId); },
  ff:el=>{ UI.ff=el.dataset.f; setPressed('[data-a="ff"]','f',UI.ff); renderFoodList(); },
  newFood:()=>{ SH=null; foodForm(null); },
  logFood:()=>{ const id=SH.pick.id; SH={ctx:{mode:'log',meal:defaultMeal()},fromSearch:false}; openAmount('food',id); },
  editFood:()=>foodForm(getFood(SH.pick.id)),
  copyFood:()=>foodForm(getFood(SH.pick.id)),
  delFood:el=>{ if(!confirmGate(el)) return; Store.del('f_'+SH.pick.id); Sheet.close(); render(); toast('Food deleted'); },
  saveFood:()=>saveFoodForm(),
  weighSheet:()=>{ UI.view='weight'; window.scrollTo(0,0); render(); setTimeout(()=>{ const i=$('#wval'); if(i) i.focus(); },60); },
  saveWeight:()=>{ const d=$('#wdate').value||todayStr(), w=parseFloat($('#wval').value); if(!(w>20&&w<400)){ toast('Enter your weight in kg'); return; } const log=Object.assign({},weights()); log[d]=Math.round(w*10)/10; Store.put('weights',{log}); UI.wdate=false; render(); toast('Weight saved'); },
  delWeight:el=>{ const log=Object.assign({},weights()); delete log[el.dataset.d]; Store.put('weights',{log}); render(); },
  useTrend:()=>{ const s=weightSeries(); if(!s.length) return; const p=getProfile(); p.weight=Math.round(s[s.length-1].t*10)/10; setProfile(p); render(); toast('Targets updated'); },
  suset:el=>{ UI.setup[el.dataset.k]=el.dataset.v; setPressed(`[data-a="suset"][data-k="${el.dataset.k}"]`,'v',el.dataset.v); },
  saveSetup:async()=>{ const d=UI.setup; const name=(d.name||'').trim();
    if(!name){ toast('Enter a name'); return; } if(!d.sex){ toast('Choose a sex for the calorie formula'); return; }
    if(!(d.age>0&&d.height>0&&d.weight>0)){ toast('Fill in age, height and weight'); return; } if(!d.goal){ toast('Choose a goal'); return; }
    if(!Store.pid){ const id=await Store.addPerson(name); await Store.switchTo(id); } else await Store.renamePerson(Store.pid,name);
    const old=hasProfile()?getProfile():{}; setProfile(Object.assign({},FALLBACK_PROFILE,old,{sex:d.sex,age:+d.age,height:+d.height,weight:+d.weight,activity:+d.activity,goal:d.goal,pkg:old.pkg||(d.goal==='cut'?2.2:1.8)}));
    if(!weights()[todayStr()]){ const log=Object.assign({},weights()); log[todayStr()]=+d.weight; Store.put('weights',{log}); }
    await Store.flushAll(); UI.setup=null; UI.view='today'; render(); },
  cancelSetup:async()=>{ if(!hasProfile()&&Store.people.length>1){ const id=Store.pid; const other=Store.people.find(p=>p.id!==id); await Store.removePerson(id); await Store.switchTo(other.id); } UI.view='profile'; render(); },
  pset:el=>{ const p=getProfile(); p[el.dataset.k]=el.dataset.v; setProfile(p); render(); },
  consOn:el=>{ const p=getProfile(); p.cons.on=el.checked; setProfile(p); toast(el.checked?'Conservative counting on':'Counting average values'); },
  consInfo:()=>{ UI.view='profile'; UI.open.cons=true; window.scrollTo(0,0); render(); setTimeout(()=>{ const d=$('details[data-g="cons"]'); if(d) d.scrollIntoView({block:'start'}); },60); },
  pman:el=>{ const p=getProfile(); p.manual=el.checked; if(p.manual&&!p.custom){ const c=calcTargets(p); p.custom={kcal:c.kcal,p:c.p,c:c.c,f:c.f,fib:c.fib}; } setProfile(p); $('#tcalc').innerHTML=targetsHTML(); },
  whoSheet:()=>{ SH={ctx:{mode:'who'},fromSearch:false}; Sheet.open(`<div class="sh-head"><h2>Who’s logging?</h2><button class="icon" data-a="close" aria-label="Close">✕</button></div><ul class="people">${Store.people.map(x=>`<li><span class="pn">${esc(x.name||'Unnamed')}${x.id===Store.pid?'<small>Using now</small>':''}</span>${x.id===Store.pid?'':`<button class="ghost small" data-a="switchTo" data-id="${esc(x.id)}">Switch</button>`}</li>`).join('')}</ul>`); },
  switchTo:async el=>{ await Store.switchTo(el.dataset.id); Sheet.close(); UI.view='today'; UI.date=todayStr(); render(); toast('Now logging for '+(Store.personName()||'this person')); },
  addPerson:async()=>{ await Store.flushAll(); const id=await Store.addPerson(''); await Store.switchTo(id); startSetup(true); UI.setup.isNew=false; render(); },
  delPerson:async el=>{ if(!confirmGate(el)) return; const id=Store.pid; const other=Store.people.find(p=>p.id!==id); await Store.removePerson(id); await Store.switchTo(other.id); UI.view='today'; render(); toast('Person deleted'); },
  export:()=>doExport(),
  import:()=>showImport(),
  doImport:async el=>{ const f=$('#iofile'),p=$('#iopaste'); let text=p&&p.value.trim(); if(!text&&f&&f.files&&f.files[0]) text=await f.files[0].text(); if(!text){ toast('Choose a file or paste a backup first'); return; } if(!confirmGate(el)) return; await doImport(text); }
};
const INP={
  sq:el=>{ SH.q=el.value; renderResults(); },

  qty:el=>{ SH.qty=parseFloat(el.value)||0; updatePreview(); },

  pact:el=>{ const p=getProfile(); p.activity=parseFloat(el.value); setProfile(p); $('#tcalc').innerHTML=targetsHTML(); },

};
function updIng(r,i){ const it=r.items[i],f=getFood(it.fid),s=$('#ik'+i); if(f&&s){ const g=gramsOf(f,it.qty,it.unit); s.textContent=`${num(f.v.kcal*g/100,'kcal')} kcal, ${num(f.v.p*g/100)} g protein`; } syncOpen(); $('#rtot').innerHTML=panelHTML(r); }

document.addEventListener('click',e=>{ const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a; if(ACT[a]){ if(el.tagName!=='INPUT') e.preventDefault(); ACT[a](el,e); } });
document.addEventListener('input',e=>{ const el=e.target.closest('[data-in]'); if(el&&INP[el.dataset.in]) INP[el.dataset.in](el,e); });
document.addEventListener('keydown',e=>{ if(e.key==='Tab'&&!$('#sheet').hidden){ const f=$$('#sheet-body button,#sheet-body input,#sheet-body select,#sheet-body textarea,#sheet-body summary').filter(x=>!x.disabled&&x.offsetParent!==null); if(f.length){ const first=f[0],last=f[f.length-1]; if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); } } }
  if(e.key==='Escape'&&!$('#sheet').hidden) Sheet.close(); if(e.key==='Enter'){ if(e.target.id==='qty'){ const c=$('#confirm'); if(c&&!c.disabled) c.click(); } if(e.target.id==='bc') ACT.bcGo(); if(e.target.id==='wval') ACT.saveWeight(); } });
document.addEventListener('toggle',e=>{ const d=e.target; if(d&&d.dataset&&d.dataset.g) UI.open[d.dataset.g]=d.open; },true);
let LAST_TODAY=todayStr();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ Store.flushAll(); stopCamera(); return; }
  const now=todayStr(); if(now!==LAST_TODAY){ if(UI.date===LAST_TODAY) UI.date=now; LAST_TODAY=now; if(!SH) render(); } });
window.addEventListener('pagehide',()=>Store.flushAll());

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost') && window.top===window){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
Store.init().then(()=>render(),()=>render());
})();
